<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>이동 중… · 라파엔투자자문</title>
<script>
// Strategy 메뉴는 자문 상품(Product)으로 바뀌었다. 예전 링크(strategy.html?v=rs 등)는
// 같은 콘텐츠가 옮겨간 Information 으로, 그 외에는 자문 상품 페이지로 보낸다.
(function () {
  var v = null; try { v = new URLSearchParams(location.search).get('v'); } catch (e) {}
  location.replace(v ? 'information.html?v=' + encodeURIComponent(v) : 'product.html');
})();
</script>
</head>
<body><p><a href="product.html">자문 상품 페이지로 이동</a></p></body>
</html>
